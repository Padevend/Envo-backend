name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Postgres et Redis réels : tests d'intégration (stores Prisma, outbox, Lua du rate limit, BullMQ).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: envo
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: envo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U envo -d envo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://envo:ci-only-password@localhost:5432/envo_test
      REDIS_URL: redis://localhost:6379
      LOG_LEVEL: silent
      RUN_INTEGRATION: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # nécessaire à gitleaks (historique)

      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # Le cache pnpm exige un pnpm-lock.yaml ; tant qu'il n'est pas commité, pas de cache.
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}

      - name: Installation
        run: pnpm install ${{ hashFiles('pnpm-lock.yaml') != '' && '--frozen-lockfile' || '--no-frozen-lockfile' }}

      - name: Client Prisma
        run: pnpm prisma:generate

      - name: Migrations (valide aussi le SQL écrit à la main)
        run: pnpm db:migrate:deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Frontières de modules (dependency-cruiser)
        run: pnpm arch

      - name: Tests (unitaires, architecture, intégration)
        run: pnpm test

      - name: Audit des dépendances
        run: pnpm audit:deps

      - name: Build
        run: pnpm build

      - name: Scan de secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
